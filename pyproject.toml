[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harle-backend"
version = "0.1.0"
description = "Harle Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg",
    "fastapi",
    "google-genai",
    "google-auth",
    "gspread",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "ruff",
]

[project.scripts]
gemini = "harle_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "harle_agent*",
    "harle_api*",
    "harle_cli*",
    "harle_domain*",
    "harle_infrastructure*",
    "harle_services*",
    "harle_utils*",
]

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
mypy_path = "src"
packages = [
    "harle_agent",
    "harle_api",
    "harle_cli",
    "harle_domain",
    "harle_infrastructure",
    "harle_services",
    "harle_utils",
]
python_version = "3.10"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "google.*",
    "gspread.*",
]
ignore_missing_imports = true

[tool.pylint.main]
ignore = ["old_attempt"]
py-version = "3.10"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "line-too-long",
    "logging-fstring-interpolation",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
]

[tool.pylint.design]
max-attributes = 16
max-locals = 16

[tool.pylint.reports]
fail-under = 10.0

[tool.vercel]
entrypoint = "src.harle_api.app:harle_app"

[tool.pymetrica]
mc_fail_threshold = 20
